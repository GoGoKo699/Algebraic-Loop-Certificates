[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algebraic-loop-certificates"
version = "0.1.0"
description = "Exact positive-hit certificates for prime-field affine recurrences"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ruge Lin"}]
dependencies = []

[project.scripts]
alc = "alc.__main__:main"

[tool.setuptools.packages.find]
include = ["alc*"]
