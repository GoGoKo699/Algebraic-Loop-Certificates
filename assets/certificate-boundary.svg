<svg xmlns="http://www.w3.org/2000/svg" width="600" height="410" viewBox="0 0 600 410" role="img" aria-labelledby="title desc">
  <title id="title">The problem is supplied separately from the candidate proof</title>
  <desc id="desc">An independently supplied recurrence or circuit and an untrusted certificate or witness enter the checker separately. Acceptance establishes only the checked claim under the relevant interface contract.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 Z" fill="#61788d"/></marker>
    <style>
      text {font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#243746;text-anchor:middle}
      .heading {font-size:25px;font-weight:650}
      .body {font-size:22px}
      .line {fill:none;stroke:#61788d;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="600" height="410" rx="18" fill="#f8fbfd"/>
  <text x="150" y="39" class="body">Independently supplied</text>
  <text x="450" y="39" class="body">Untrusted</text>
  <rect x="24" y="58" width="252" height="104" rx="14" fill="#fff" stroke="#91a8b9" stroke-width="2"/>
  <rect x="324" y="58" width="252" height="104" rx="14" fill="#fff" stroke="#91a8b9" stroke-width="2"/>
  <text x="150" y="101" class="heading">Problem</text>
  <text x="150" y="136" class="body">Recurrence or circuit</text>
  <text x="450" y="101" class="heading">Candidate proof</text>
  <text x="450" y="136" class="body">Certificate or witness</text>
  <path d="M150,163 V187 L234,222" class="line"/>
  <path d="M450,163 V187 L366,222" class="line"/>
  <rect x="141" y="224" width="318" height="91" rx="14" fill="#d9e8f2" stroke="#61788d" stroke-width="2"/>
  <text x="300" y="259" class="heading">Check against</text>
  <text x="300" y="292" class="body">the original problem</text>
  <path d="M300,316 V350" class="line"/>
  <text x="300" y="385" class="body">Accept only the checked claim</text>
</svg>
